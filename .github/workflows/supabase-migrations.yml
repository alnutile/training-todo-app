name: Apply Supabase migrations

# Runs the SQL in supabase/migrations against the linked project whenever a
# migration (or this workflow) changes on main. `supabase db push` only applies
# versions not already recorded in the project, so it's safe to re-run.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Project ref is public (it's in the API URL), so it's fine in plaintext.
      SUPABASE_PROJECT_REF: torocnrxwdepeceouzpe
      # Secrets — add these in GitHub repo Settings → Secrets and variables → Actions:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push
