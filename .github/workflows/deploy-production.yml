name: Deploy (production)

# main only. And only if everything is green.
#
# The two `uses:` jobs below run the exact same CI and database workflows a
# branch runs — that's the gate. If a single test fails, or a migration doesn't
# apply cleanly to an empty database, nothing below it runs and production is
# left alone.
#
# Order matters: migrations first, then the edge function, then the web app. A
# UI that expects a column the database doesn't have yet is the classic way to
# break a deploy that "passed".

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Never let two production deploys overlap. Unlike CI, in-flight runs are not
# cancelled — half a deploy is worse than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    name: CI
    uses: ./.github/workflows/ci.yml

  database-checks:
    name: Database
    uses: ./.github/workflows/database.yml

  supabase:
    name: Supabase (migrations + edge functions)
    needs: [tests, database-checks]
    runs-on: ubuntu-latest
    # GitHub Environment — this is where the production secrets live, and where
    # you'd add a required reviewer if you want a human to approve deploys.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # A repo/environment *variable*, not a secret: the project ref is public
      # (it's right there in the API URL).
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Are the production credentials configured?
        id: check
        run: |
          missing=""
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD(secret)"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Supabase deploy skipped::Not configured yet. Missing:$missing — add them under Settings → Secrets and variables → Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Link the project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # `db push` only applies versions the project hasn't recorded yet, so
      # re-running this is safe.
      - name: Push migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push

      - name: Deploy edge functions
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy todo-stats --project-ref "$SUPABASE_PROJECT_REF"

  web:
    name: Railway (web app)
    needs: [tests, database-checks, supabase]
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_WEB }}
    steps:
      - uses: actions/checkout@v4

      - name: Is Railway configured?
        id: check
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Railway deploy skipped::No RAILWAY_TOKEN secret. Railway's own GitHub integration also redeploys on every push to main — this job is only needed if you want the deploy gated behind CI."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          npm install -g @railway/cli
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --service "$RAILWAY_SERVICE" --detach
          else
            railway up --detach
          fi
